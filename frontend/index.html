<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Verifill Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: pharmacy-system workstation. Navy app bar + workflow stations | fax inbox grid | 3D fax viewer | Rx verification panel | status bar. Rx-blue accent, light and dark. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#f5f7fa; --line:#dbe2ea; --line2:#c5cfdb;
  --fg:#1b2533; --mute:#556375; --dim:#8693a3;
  --accent:#1d5fbf; --accent-2:#e7effb; --on-accent:#ffffff;
  --ok:#1e7d3a; --ok-bg:#e5f3e9; --warn:#a35a00; --warn-bg:#fdf0dc; --bad:#c42b2b; --bad-bg:#fbe8e8; --conf:#6b46c1; --conf-bg:#efe9fb;
  --bar:#0f2a4a; --bar2:#173a63; --bar-fg:#eaf1fa; --bar-mute:#a3b8d1; --bar-line:#24476f;
  --stage1:#e8edf3; --stage2:#d3dce7;
  --shadow:0 1px 2px rgba(15,42,74,.08),0 3px 10px rgba(15,42,74,.06);
  --f-display:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b111a; --surface:#121a26; --surface2:#172131; --line:#223047; --line2:#2e3e58;
  --fg:#e3eaf3; --mute:#9aa9bd; --dim:#6a7a92;
  --accent:#5b9bff; --accent-2:#152846; --on-accent:#06142b;
  --ok:#4cc27a; --ok-bg:#11291b; --warn:#f2a93b; --warn-bg:#33240c; --bad:#ff6b6b; --bad-bg:#3a1717; --conf:#a78bfa; --conf-bg:#241c42;
  --bar:#070d17; --bar2:#0d1727; --bar-fg:#e3eaf3; --bar-mute:#8597b0; --bar-line:#1c2a40;
  --stage1:#111b29; --stage2:#070c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b111a; --surface:#121a26; --surface2:#172131; --line:#223047; --line2:#2e3e58;
  --fg:#e3eaf3; --mute:#9aa9bd; --dim:#6a7a92;
  --accent:#5b9bff; --accent-2:#152846; --on-accent:#06142b;
  --ok:#4cc27a; --ok-bg:#11291b; --warn:#f2a93b; --warn-bg:#33240c; --bad:#ff6b6b; --bad-bg:#3a1717; --conf:#a78bfa; --conf-bg:#241c42;
  --bar:#070d17; --bar2:#0d1727; --bar-fg:#e3eaf3; --bar-mute:#8597b0; --bar-line:#1c2a40;
  --stage1:#111b29; --stage2:#070c14;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mute);background:var(--surface)}

.app{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(420px,520px);grid-template-rows:56px minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding-inline:18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:-.01em}
.brand span{color:var(--mute);font-size:13px}
.grow{flex:1}
.shift{display:flex;gap:18px;font-size:13px;color:var(--mute)}
.shift b{color:var(--fg);font-variant-numeric:tabular-nums}
.ghost{background:transparent;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--mute)}
.ghost:hover{color:var(--fg);border-color:var(--accent)}
.menu{position:absolute;right:18px;top:52px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:14px;width:300px;z-index:30;display:flex;flex-direction:column;gap:10px;font-size:13px}
.menu label{display:flex;flex-direction:column;gap:4px;color:var(--mute)}
.menu input{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;color:var(--fg);font-family:var(--f-mono);font-size:12.5px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:7px;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

/* queue */
.queue{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.qtabs{display:flex;gap:4px;padding:12px 12px 8px;flex-wrap:wrap}
.qtab{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.qtab b{font-variant-numeric:tabular-nums;color:var(--fg)}
.qtab[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.qtab[aria-pressed="true"] b{color:var(--surface)}
.qlist{overflow:auto;padding:4px 10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;flex:1}
.qitem{flex:none;display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 0;overflow:hidden}
.qitem:hover{border-color:var(--line2);background:var(--surface2)}
.qitem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.qbar{border-radius:0 3px 3px 0}
.qname{font-weight:600}
.qdrug{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qwhy{font-size:12.5px;margin-top:3px;display:flex;gap:6px;align-items:center}
.qmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--dim)}
.badge{font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-conf{background:var(--conf-bg);color:var(--conf)} .b-mute{background:var(--surface2);color:var(--mute);border:1px solid var(--line)}
.qfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.upload{border:1px dashed var(--line2);border-radius:10px;padding:10px;text-align:center;color:var(--mute);font-size:13px;cursor:pointer}
.upload:hover{border-color:var(--accent);color:var(--fg)}
.keys{font-size:11.5px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* fax stage */
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(110% 80% at 50% 25%,var(--stage1),var(--stage2))}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.stage-bar>*{pointer-events:auto}
.views{display:flex;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.views button{border:0;background:transparent;border-radius:7px;padding:6px 11px;font-size:13px;color:var(--mute)}
.views button[aria-pressed="true"]{background:var(--accent-2);color:var(--accent);font-weight:600}
.zoomnote{margin-left:auto;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--mute);box-shadow:var(--shadow)}
.progress{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;min-width:280px;display:flex;flex-direction:column;gap:8px}
.progress h4{margin:0 0 2px;font-family:var(--f-display);font-size:16px}
.pstep{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--dim)}
.pstep i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none}
.pstep.run{color:var(--fg)} .pstep.run i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.pstep.done{color:var(--mute)} .pstep.done i{background:var(--accent);border-color:var(--accent)}
.pstep.stop{color:var(--bad);font-weight:600} .pstep.stop i{background:var(--bad);border-color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12.5px;transform:translate(12px,12px);white-space:nowrap;z-index:5;box-shadow:var(--shadow)}

/* review panel */
.review{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rscroll{overflow:auto;flex:1;min-height:0;padding:18px 18px 8px;display:flex;flex-direction:column;gap:16px}
.rxhead{display:flex;flex-direction:column;gap:6px}
.rxhead .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rxhead h2{margin:0;font-family:var(--f-display);font-size:24px;letter-spacing:-.01em;line-height:1.15}
.rxhead .sub{color:var(--mute);font-size:13.5px}
.rxline{font-family:var(--f-mono);font-size:14px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.statuspill{font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 11px;white-space:nowrap}
.sec-t{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.issue{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--surface)}
.issue.cur{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.issue.cur.red{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.issue.done{border-color:var(--line)}
.ihead{width:100%;display:flex;gap:10px;align-items:center;background:transparent;border:0;padding:11px 13px;text-align:left}
.inum{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ititle{font-weight:600;flex:1}
.ibody{padding:0 13px 13px;display:flex;flex-direction:column;gap:10px}
.snip{border:1px solid var(--line2);border-radius:8px;background-color:#fff;background-repeat:no-repeat;width:100%;filter:grayscale(1) contrast(1.05);position:relative}
.sniplab{font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between}
.read{font-size:13.5px}
.read b{font-family:var(--f-mono);font-weight:500}
.evid{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px;color:var(--fg)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px}
.opt:hover{border-color:var(--accent);background:var(--accent-2)}
.opt .k{margin-left:auto}
.opt.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.opt.primary:hover{filter:brightness(1.05)}
.opt.primary kbd{background:transparent;color:var(--on-accent);border-color:rgba(255,255,255,.5)}
.corr{display:flex;gap:6px}
.corr input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);font-size:13.5px;background:var(--surface);color:var(--fg)}
.small{border:1px solid var(--line2);background:var(--surface2);border-radius:8px;padding:7px 12px;font-size:13px}
.small:hover{border-color:var(--accent)}
details.why{font-size:13px}
details.why summary{cursor:pointer;color:var(--accent);font-weight:500}
.readers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.rd{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface2);min-width:0}
.rd.diff{border-color:var(--bad);background:var(--bad-bg)}
.rd .s{font-size:11px;color:var(--mute)} .rd .v{font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}
.ck{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;margin-top:6px;align-items:start}
.ck .m{font-weight:700} .ck.p .m{color:var(--ok)} .ck.f .m{color:var(--bad)}
.src{font-size:10.5px;font-family:var(--f-mono);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--accent);white-space:nowrap}
.alldone{display:flex;gap:10px;align-items:center;border-radius:12px;padding:12px 14px;background:var(--ok-bg);color:var(--ok);font-weight:600}

.rx{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rxg{display:grid;grid-template-columns:96px minmax(0,1fr);border-top:1px solid var(--line)}
.rxg:first-child{border-top:0}
.rxg h5{margin:0;padding:10px 12px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:var(--surface2);border-right:1px solid var(--line)}
.rxf{display:flex;flex-direction:column}
.fld{display:grid;grid-template-columns:96px minmax(0,1fr) 18px;gap:8px;align-items:center;padding:7px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:14px}
.fld:first-child{border-top:0}
.fld:hover{background:var(--surface2)}
.fld .l{font-size:12.5px;color:var(--mute)}
.fld .v{font-family:var(--f-mono);font-size:13.5px;overflow-wrap:anywhere}
.fld .v.none{color:var(--dim);font-style:italic;font-family:var(--f-body)}
.sdot{width:12px;height:12px;border-radius:50%}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.loc{display:flex;gap:8px;margin:8px 0}
.loc div{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px;text-align:center}
.loc b{display:block;font-family:var(--f-display);font-size:28px;color:var(--accent);line-height:1.1}
.loc span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-family:var(--f-mono)}
.note{font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--warn-bg);border-left:3px solid var(--warn)}
.note.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.note.ok{background:var(--ok-bg);border-left-color:var(--ok)}
pre.script{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0}
.log{font-size:12.5px;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.log div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px}
.log .t{font-family:var(--f-mono);color:var(--dim);font-size:11.5px}
.log .tr{font-family:var(--f-mono);color:var(--dim);font-size:11px}
details.card>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}

.actionbar{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;align-items:center;background:var(--surface);flex-wrap:wrap}
.actionbar .hint{font-size:12.5px;color:var(--mute);flex-basis:100%}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.go{margin-left:auto;background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;padding:10px 18px}
.btn.go:disabled{background:var(--surface2);color:var(--dim);border-color:var(--line2)}
.btn.danger{color:var(--bad)}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.toastbtn{margin-left:10px;background:transparent;border:1px solid currentColor;border-radius:6px;padding:3px 10px;color:inherit;font-weight:600}
.rejsel{border:1px solid var(--line2);border-radius:8px;padding:7px 8px;background:var(--surface);color:var(--fg);font:inherit;font-size:13.5px}
.toast{display:flex;align-items:center;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--fg);color:var(--surface);border-radius:10px;padding:10px 16px;font-size:14px;z-index:40;box-shadow:var(--shadow)}
.demo{font-size:12px;color:var(--dim)}

@media (max-width:1250px){.app{grid-template-columns:250px minmax(0,1fr) 420px}.shift{display:none}}
@media (max-width:960px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 52vh auto;height:auto}
  header{flex-wrap:wrap;padding-block:10px}
  .queue{border-right:0;border-bottom:1px solid var(--line)}
  .qlist{flex-direction:row;overflow-x:auto}.qitem{min-width:250px}
  .review{border-left:0}.rscroll{overflow:visible}
  .actionbar{position:sticky;bottom:0}
  .keys{display:none}
}

/* ---- workstation chrome ---- */
body{font-size:14px}
.app{grid-template-rows:48px 38px minmax(0,1fr) 28px}
header{background:var(--bar);color:var(--bar-fg);border-bottom:1px solid var(--bar-line);gap:16px}
.brand b{font-family:var(--f-body);font-weight:600;font-size:17px;letter-spacing:0}
.brand span{color:var(--bar-mute)}
.mark{background:#fff;color:#0f2a4a;border-radius:6px;width:28px;height:28px;font-family:var(--f-body)}
.store{display:flex;flex-direction:column;line-height:1.15;font-size:12px;color:var(--bar-mute);border-left:1px solid var(--bar-line);padding-left:14px}
.store b{color:var(--bar-fg);font-weight:500;font-size:13px}
.shift{color:var(--bar-mute)} .shift b{color:var(--bar-fg)}
header .ghost{color:var(--bar-fg);border-color:var(--bar-line);background:transparent;display:inline-flex;gap:6px;align-items:center}
header .ghost:hover{border-color:var(--bar-mute)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--bar-mute)}
.who i{width:26px;height:26px;border-radius:50%;background:var(--bar2);display:grid;place-items:center;color:var(--bar-fg);font-style:normal;font-weight:600;font-size:11px;border:1px solid var(--bar-line)}
#clock{font-family:var(--f-mono);color:var(--bar-fg);font-size:12.5px}
.stations{grid-column:1/-1;display:flex;gap:0;background:var(--bar2);border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.stations .qtab{border:0;border-radius:0;background:transparent;color:var(--bar-mute);padding:0 16px;height:38px;font-size:13px;border-bottom:3px solid transparent;display:flex;gap:8px;align-items:center;white-space:nowrap}
.stations .qtab b{background:rgba(255,255,255,.12);color:var(--bar-fg);border-radius:10px;padding:0 7px;font-size:11.5px;line-height:18px}
.stations .qtab:hover{color:var(--bar-fg)}
.stations .qtab[aria-pressed="true"]{background:transparent;color:var(--bar-fg);border-bottom-color:#7fb2ff;font-weight:600}
.stations .qtab[aria-pressed="true"] b{background:#7fb2ff;color:#0b2142}
.stations .arrow{color:var(--bar-mute);opacity:.5;align-self:center;font-size:11px}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line)}
.qlist{padding:0;gap:0}
.qitem{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:9px 12px 9px 0}
.qitem:hover{background:var(--surface2)}
.qitem[aria-current="true"]{background:var(--accent-2);box-shadow:inset 3px 0 0 var(--accent)}
.qname{font-size:13.5px}

/* mock re-run of inventory after a pharmacist resolves a field */
function mockInventory(o){

  const d=(o.fields.drug.value||"").toLowerCase(), st=o.fields.strength.value;
  const item=Object.values(INV).find(i=>i.drug===d&&i.strength===st);
  const qty=parseInt(o.fields.quantity.value)||0;
  if(o.pick_ticket&&o.pick_ticket.status!=="blocked") return;
  if(!item){o.pick_ticket={status:"out_of_stock",item:null,qty_needed:qty,qty_to_pick:0,owed:qty,substitution:null,substitution_requires_approval:false,warnings:[`No ${d} ${st} in inventory`]};return;}

}

/* ============ PLAIN-LANGUAGE ISSUES ============ */
function issuesOf(o){
  if(!o?.fields)return[];
  const rank=f=>(f.status==="conflict"?0:10)+(CRITICAL.has(f.name)?0:5)+FIELD_ORDER.indexOf(f.name)/100;
  return Object.values(o.fields).filter(f=>f.status==="review"||f.status==="conflict").sort((a,b)=>rank(a)-rank(b)).map(f=>({field:f.name,f,title:titleOf(f),red:f.status==="conflict"}));
}
function titleOf(f){
  if(f.reasons?.[0]?.startsWith("This fax was blocked"))return f.name==="npi"?"Confirm the prescriber's NPI with the office":"Confirm the patient with the office";
  const failed=f.checks?.some(c=>!c.passed);
  switch(f.name){
    case "drug":return f.candidates?.length?"Drug name is unclear":"Confirm the drug";
    case "strength":return failed?"Dose looks unsafe as written":"Confirm the strength";
    case "npi":return failed&&f.value?"Prescriber NPI doesn't validate":"NPI isn't fully readable";
    case "quantity":return failed?"Quantity doesn't match the directions":(f.candidates?.length?"Quantity is unclear":"Confirm the quantity");
    case "patient_name":return "Confirm the patient's name";
    case "dob":return "Confirm date of birth";
    case "sig":return "Confirm the directions";
    case "prescriber_name":return "Confirm the prescriber";
    case "days_supply":return "Confirm days supply";
    case "refills":return "Confirm refills";
    default:return "Confirm "+LABELS[f.name].toLowerCase();
  }
}
function optionsOf(f){
  const o=[],failed=f.checks?.some(c=>!c.passed);
  (f.candidates||[]).forEach(c=>{
    let label=`Use ${c}`,sub="";
    if(f.name==="drug"){label=cap(c);sub="Pick after checking the fax and directions";}
    if(f.name==="strength"){label=`Change to ${c}`;sub="Only after the prescriber confirms";}
    if(f.name==="npi"){label=`Use ${c}`;sub="Registry match for this prescriber";}
    if(f.name==="quantity"){label=`Use ${c}`;sub=failed?"Matches directions × days supply":"";}
    o.push({value:c,label,sub});
  });
  if(f.value&&!f.candidates?.includes(f.value)){
    o.unshift(failed?{value:f.value,label:`Keep as written: ${f.value}`,sub:"Only if the prescriber confirmed it",override:"Prescriber confirmed as written"}:{value:f.value,label:`Matches the fax: ${f.value}`,sub:"Confirm what Verifill read",primary:!f.candidates?.length});
  }
  return o;
}
function evidenceOf(f){
  const ev=(f.reasons||[]).filter(r=>!/readers agree$/.test(r));
  (f.checks||[]).filter(c=>!c.passed).forEach(c=>{if(!ev.some(e=>e.includes(c.detail)))ev.push(c.detail);});
  return ev;
}
function category(s){const o=S.orders[s.id];
  if(S.filled[s.id])return"filled";if(!o)return"new";if(o.status==="rejected")return"blocked";if(o.status==="not_prescription"||o.status==="denied_by_prescriber")return"filed";if(S.rejected[s.id])return"rejected";if(o.status==="ready_to_fill")return"ready";return"review";}
const CAT={review:["To review","warn"],ready:["Ready to fill","ok"],blocked:["Blocked","bad"],rejected:["Rejected","bad"],filed:["Filed","mute"],filled:["Filled","conf"],new:["Not read yet","mute"]};

async function runWithProgress(promise,title){
  const st=["","","",""];let res,err,done=false;promise.then(r=>{res=r;done=true},e=>{err=e;done=true});
  for(let i=0;i<4;i++){st[i]="run";renderProgress(st,title);Scene.scan(true);await sleep(S.mode==="mock"?320:600);

$("#fileIn").onchange=async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;
  if(S.mode!=="live")return toast("Adding a fax runs the real pipeline. Switch Data to Live API first.");
  const id=file.name,url=URL.createObjectURL(file);S.samples=[{id,file:file.name,severity:"",note:"Uploaded",_url:url},...S.samples.filter(s=>s.id!==id)];
  S.cur=id;renderQueue();Scene.loadFax(url);measure(id,url);S.busy=true;
  try{S.orders[id]=await runWithProgress(api.upload(file),"Reading "+id);S.seen[id]=true;const sm=S.samples.find(x=>x.id===id);if(S.orders[id]?.id&&sm){sm._url=`${S.base}/orders/${encodeURIComponent(S.orders[id].id)}/page.png`;measure(id,sm._url);Scene.loadFax(sm._url);}}catch(err){toast(err.message);}finally{S.busy=false;}
  if(S.orders[id])Scene.loadOrder(S.orders[id]);renderQueue();renderReview();focusIssue();};
/* ============ 3D SCENE (three.js r128) ============ */
const Scene=(()=>{
  const COL={verified:0x16a34a,review:0xe08a10,conflict:0xdc2626,confirmed:0x3b6fe0,accent:0x2f7de1};
  const canvas=$("#scene"),stage=$("#stage");
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  const isDark=()=>{const c=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();const n=parseInt(c.slice(1),16);return ((n>>16)+((n>>8)&255)+(n&255))/3<100;};
  const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xd3dce7,34,80);
  const camera=new THREE.PerspectiveCamera(38,1,.1,200);camera.position.set(0,0,17);
  const controls=new THREE.OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=5;controls.maxDistance=40;
  scene.add(new THREE.AmbientLight(0xbfd6e0,.55));
  const key=new THREE.DirectionalLight(0xffffff,.85);key.position.set(-6,8,12);scene.add(key);
  const rim=new THREE.PointLight(0x3fd0c0,1.2,40);rim.position.set(8,-4,6);scene.add(rim);
  const grid=new THREE.GridHelper(80,80,0xa9bad0,0xcfd9e6);grid.position.y=-6.4;grid.material.transparent=true;grid.material.opacity=.55;scene.add(grid);

  const W=7.73,H=10;let imgW=1700,imgH=2200;
  const doc=new THREE.Group();scene.add(doc);
  const paperMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9,metalness:0});
  const edgeMat=new THREE.MeshStandardMaterial({color:0xd8dde0,roughness:1});
  const paper=new THREE.Mesh(new THREE.BoxGeometry(W,H,.05),[edgeMat,edgeMat,edgeMat,edgeMat,paperMat,edgeMat]);doc.add(paper);
  // soft shadow glow behind the sheet
  const glowTex=radialTex("rgba(10,40,40,0.28)");
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(W*1.7,H*1.5),new THREE.MeshBasicMaterial({map:glowTex,transparent:true,depthWrite:false}));glow.position.z=-.6;glow.position.y=-.25;doc.add(glow);
  const boxes=new THREE.Group();doc.add(boxes);
  const layers=new THREE.Group();doc.add(layers);
  const beams=new THREE.Group();doc.add(beams);
  // scan bar
  const scanBar=new THREE.Mesh(new THREE.PlaneGeometry(W*1.04,.18),new THREE.MeshBasicMaterial({color:COL.accent,transparent:true,opacity:.0,blending:THREE.AdditiveBlending,depthWrite:false}));scanBar.position.z=.08;doc.add(scanBar);
  let scanning=false;

  const shelf=new THREE.Group();shelf.visible=false;scene.add(shelf);
  let order=null,hi=null,hover=null,view="fax",stackT=0,stackTarget=0;
  const tex=new THREE.TextureLoader();tex.crossOrigin="anonymous";

  function radialTex(c){const cv=document.createElement("canvas");cv.width=cv.height=256;const g=cv.getContext("2d");const gr=g.createRadialGradient(128,128,10,128,128,128);gr.addColorStop(0,c);gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(cv);}
  function textSprite(lines,{color,bg,border="#1d5fbf",size=44,scale=1}={}){const dk=isDark();color=color||(dk?"#e4eeee":"#152325");bg=bg||(dk?"rgba(21,32,35,.95)":"rgba(255,255,255,.96)");
    const cv=document.createElement("canvas"),g=cv.getContext("2d");g.font=`600 ${size}px "IBM Plex Sans", sans-serif`;
    const w=Math.max(...lines.map(l=>g.measureText(l).width))+56,h=lines.length*size*1.25+36;cv.width=w;cv.height=h;
    g.fillStyle=bg;roundRect(g,2,2,w-4,h-4,18);g.fill();g.strokeStyle=border;g.lineWidth=4;g.stroke();
    g.font=`600 ${size}px "IBM Plex Sans", sans-serif`;g.fillStyle=color;g.textBaseline="top";lines.forEach((l,i)=>g.fillText(l,28,18+i*size*1.25));
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false,transparent:true}));
    s.scale.set(w/150*scale,h/150*scale,1);s.renderOrder=10;return s;}
  function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
  const toWorld=(x,y)=>[(x/imgW-.5)*W,(.5-y/imgH)*H];
  function clear(g){while(g.children.length){const c=g.children.pop();c.traverse(o=>{o.geometry?.dispose();if(o.material){[].concat(o.material).forEach(m=>{m.map?.dispose();m.dispose();});}});}}

  function loadFax(url){
    order=null;clear(boxes);clear(layers);clear(beams);stackT=0;
    tex.load(url,t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=8;paperMat.map=t;paperMat.needsUpdate=true;
      if(S.mode==="live"){imgW=t.image.naturalWidth||t.image.width;imgH=t.image.naturalHeight||t.image.height;}else{imgW=1700;imgH=2200;}
      const h=H, w=H*imgW/imgH; paper.scale.x=w/W; if(order)loadOrder(order,true);});
  }
  function fieldBox(name,f,bb){
    const [x0,y0]=toWorld(bb[0],bb[1]),[x1,y1]=toWorld(bb[2],bb[3]);
    const w=Math.abs(x1-x0)*paper.scale.x,h=Math.abs(y1-y0),cx=(x0+x1)/2*paper.scale.x,cy=(y0+y1)/2;
    const g=new THREE.Group();g.position.set(cx,cy,.04);g.userData={field:name,baseZ:.04};
    const c=COL[f.status]||COL.review;
    const fill=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.16,depthWrite:false,side:THREE.DoubleSide}));fill.userData.field=name;g.add(fill);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,.1)),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.95}));g.add(edges);

  }
  function loadOrder(o,keepView){

      const bb=o._injection||[100,1930,1600,2010];
      const g=fieldBox("injection",{status:"conflict"},bb);boxes.add(g);
      const sp=textSprite(["Hidden instruction blocked","No AI reader saw this fax"],{border:"#c62828",size:38});
      sp.position.set(0,-H/2-.9,.6);boxes.add(sp);
    }
    Object.values(o.fields||{}).forEach(f=>{const bb=(f.readings||[]).find(r=>r.bbox)?.bbox||BBOX[f.name];if(bb)boxes.add(fieldBox(f.name,f,bb));});
    buildLayers(o);buildShelf(o);
    if(!keepView&&view==="shelf"&&!o.fields)setView("fax");
  }

  /* ---- trust stack: one translucent layer per reader + verdict ---- */
  function buildLayers(o){
    if(!o.fields||!Object.keys(o.fields).length)return;
    const srcs=[["ocr","Tesseract OCR"],["reader_a","Reader A · vendor 1"],["reader_b","Reader B · vendor 2"],["verdict","Verdict + grounded checks"]];
    srcs.forEach(([key,title],li)=>{
      const cv=document.createElement("canvas");cv.width=850;cv.height=1100;const g=cv.getContext("2d");
      g.fillStyle=li===3?"rgba(8,30,30,.55)":"rgba(10,20,28,.5)";g.fillRect(0,0,850,1100);
      g.strokeStyle=li===3?"rgba(63,208,192,.9)":"rgba(122,160,180,.6)";g.lineWidth=5;g.strokeRect(3,3,844,1094);
      g.fillStyle=li===3?"#3fd0c0":"#cfe0e8";g.font='700 40px "Bricolage Grotesque", sans-serif';g.fillText(title,30,62);
      g.font='500 22px "IBM Plex Mono", monospace';g.fillStyle="#8aa0ae";g.fillText(li===3?"green = agree + checks pass":"what this reader saw",30,96);
      Object.values(o.fields).forEach(f=>{
        const bb=(f.readings||[]).find(r=>r.bbox)?.bbox||BBOX[f.name];if(!bb)return;
        const x=bb[0]/imgW*850,y=bb[1]/imgH*1100,w=(bb[2]-bb[0])/imgW*850,h=(bb[3]-bb[1])/imgH*1100;
        let val,color;
        if(key==="verdict"){val=f.value??"?";color={verified:"#22c55e",review:"#f0a432",conflict:"#ef4b4b",confirmed:"#7aa7ff"}[f.status];}
        else{const r=f.readings.find(r=>r.source.startsWith(key));val=r?.value??"—";
          const others=f.readings.filter(x=>x!==r).map(x=>norm(x.value));const agree=r&&r.value&&others.includes(norm(r.value));color=!r||!r.value?"#5d7382":agree?"#d6e6ee":"#ff7a7a";}
        g.fillStyle=color+"33";g.fillRect(x,y,w,h);g.strokeStyle=color;g.lineWidth=2.5;g.strokeRect(x,y,w,h);
        g.fillStyle=color;g.font=`600 ${Math.min(26,h*.62)}px "IBM Plex Mono", monospace`;
        let t=String(val);while(g.measureText(t).width>Math.max(w-8,60)*1.6&&t.length>3)t=t.slice(0,-2)+"…";
        g.fillText(t,x+6,y+h*.72);
      });

      const m=new THREE.Mesh(new THREE.PlaneGeometry(W*paper.scale.x,H),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));
      m.userData.li=li+1;m.renderOrder=2+li;layers.add(m);
    });

      b.position.set(x0*paper.scale.x+.12,(y0+y1)/2,0);b.userData.field=f.name;beams.add(b);
    });
  }

  /* ---- shelf: arc of shelving units, target bin glows ---- */
  const AISLES=["1","2","3","4","5","6","7","CII"];
  function binPos(aisle,sh,bin){
    const ai=AISLES.indexOf(String(aisle));if(ai<0)return null;
    const row=isNaN(+sh)?"ABCD".indexOf(sh):(+sh-1);const col=(parseInt(bin)||1)-1;
    const a=(ai-(AISLES.length-1)/2)*.27,R=16;
    const unit=new THREE.Vector3(Math.sin(a)*R,0,8-Math.cos(a)*R);
    const local=new THREE.Vector3(-1.45+col*.21+.105,2.1-row*1.25-.35,.25);
    local.applyAxisAngle(new THREE.Vector3(0,1,0),-a);return unit.add(local);
  }
  function buildShelf(o){
    clear(shelf);
    const dk=isDark();const frameMat=new THREE.MeshStandardMaterial({color:dk?0x2a3c4a:0x9aaeb0,roughness:.6,metalness:.4});
    const boardMat=new THREE.MeshStandardMaterial({color:dk?0x1b2a35:0xe9efef,roughness:.8});
    const binGeo=new THREE.BoxGeometry(.17,.42,.42);
    const bins=new THREE.InstancedMesh(binGeo,new THREE.MeshStandardMaterial({roughness:.7}),AISLES.length*4*14);
    let k=0;const m4=new THREE.Matrix4(),col=new THREE.Color();
    const pt=o.pick_ticket||{};const locked=pt.status==="blocked";
    AISLES.forEach((A,ai)=>{
      const a=(ai-(AISLES.length-1)/2)*.27,R=16;
      const u=new THREE.Group();u.position.set(Math.sin(a)*R,0,8-Math.cos(a)*R);u.rotation.y=-a;shelf.add(u);
      [-1.55,1.55].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.08,5.4,.6),frameMat);p.position.set(x,0,0);u.add(p);});
      for(let r=0;r<5;r++){const b=new THREE.Mesh(new THREE.BoxGeometry(3.1,.06,.62),boardMat);b.position.set(0,2.6-r*1.25,0);u.add(b);}
      const lab=textSprite([A==="CII"?"C-II SAFE":"AISLE "+A],{size:40,scale:.75,border:A==="CII"?"#c62828":"#8aa3a5"});lab.position.set(0,3.25,0);u.add(lab);
      for(let r=0;r<4;r++)for(let c=0;c<14;c++){

      }
    });

    const mark=(it,color,lines)=>{if(!it)return;const p=binPos(it.aisle,it.shelf,it.bin);if(!p)return;
      const gm=new THREE.Mesh(new THREE.BoxGeometry(.24,.5,.5),new THREE.MeshBasicMaterial({color}));gm.position.copy(p);gm.userData.pulse=true;shelf.add(gm);
      const beam=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,7,8,1,true),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));beam.position.set(p.x,p.y+3.6,p.z);shelf.add(beam);
      const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:radialTex("rgba(255,255,255,0.9)"),color,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));halo.scale.set(1.6,1.6,1);halo.position.copy(p);shelf.add(halo);
      const s=textSprite(lines,{border:"#"+new THREE.Color(color).getHexString(),size:36,scale:.8});s.position.set(p.x,p.y+4.4,p.z);shelf.add(s);return p;};
    shelf.userData.focus=new THREE.Vector3(0,0,-6);
    if(locked){
      (pt._ghosts||[]).forEach(it=>mark(it,COL.review,[`? ${it.drug} ${it.strength}`,`${it.aisle}·${it.shelf}·${it.bin}  in stock`]));
      const lk=textSprite(["Stock locked","Confirm the drug first. Stock never decides."],{border:"#c62828",size:44,scale:1.1});lk.position.set(0,5.6,-4);shelf.add(lk);
    }else{
      const p=mark(pt.item,COL.verified,[`${pt.item?.drug} ${pt.item?.strength}`,`Aisle ${pt.item?.aisle} · Shelf ${pt.item?.shelf} · Bin ${pt.item?.bin}`]);
      if(pt.substitution&&pt.substitution_requires_approval){const q=mark(pt.substitution,COL.review,[`Substitute? ${pt.substitution.brand||""}`,`${pt.substitution.aisle}·${pt.substitution.shelf}·${pt.substitution.bin} · needs approval`]);if(q)shelf.userData.focus=q.clone();}
      if(p)shelf.userData.focus=p.clone();
      if(!pt.item&&!pt.substitution){const s=textSprite([o.status==="rejected"?"Rejected before inventory":"Out of stock"],{border:"#ef4b4b"});s.position.set(0,5,-4);shelf.add(s);}
    }
  }

  /* ---- views + camera tweening ---- */
  let camGoal=null,tgtGoal=null;
  function setView(v){
    view=v;
    if(v==="fax"){stackTarget=0;doc.visible=true;shelf.visible=false;camGoal=new THREE.Vector3(1.6,-1,15.5);tgtGoal=new THREE.Vector3(0,0,0);grid.position.y=-6.4;}
    if(v==="stack"){stackTarget=1;doc.visible=true;shelf.visible=false;camGoal=new THREE.Vector3(13.5,5,13);tgtGoal=new THREE.Vector3(0,0,3.2);grid.position.y=-6.4;}
    if(v==="shelf"){doc.visible=false;shelf.visible=true;const f=shelf.userData.focus||new THREE.Vector3(0,0,-6);camGoal=new THREE.Vector3(f.x*.55,1.6,f.z+12.5);tgtGoal=f.clone();grid.position.y=-2.75;}
  }
  function highlight(f){hi=f;}
  function focus(f){hi=f;if(view!=="fax")return;const g=boxes.children.find(b=>b.userData.field===f);
    if(!g){camGoal=new THREE.Vector3(1.6,-1,15.5);tgtGoal=new THREE.Vector3(0,0,0);return;}
    const w=Math.max(g.userData.w,2.4);const d=Math.min(9,Math.max(5.2,w*1.5));
    camGoal=new THREE.Vector3(g.position.x+1.1,g.position.y-.9,d);tgtGoal=new THREE.Vector3(g.position.x,g.position.y,0);}
  function theme(){const dk=isDark();scene.fog.color.set(dk?0x070c14:0xd3dce7);if(order)loadOrder(order);}
  function scan(on){scanning=on;}

  /* ---- picking ---- */
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();const tip=$("#tip");
  function pick(e){const r=canvas.getBoundingClientRect();mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(boxes.children.map(g=>g.userData.fill).filter(Boolean));return hits[0]?.object.userData.field||null;}
  canvas.addEventListener("pointermove",e=>{if(view==="shelf"){tip.hidden=true;return;}hover=pick(e);
    if(hover&&order){const f=order.fields?.[hover];tip.hidden=false;const r=stage.getBoundingClientRect();tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";
      tip.innerHTML=f?`<b>${LABELS[hover]}</b>: ${esc(f.value??"unreadable")} · <span style="color:var(--${{verified:"ok",review:"warn",conflict:"bad",confirmed:"conf"}[f.status]})">${{verified:"verified",review:"check this",conflict:"needs decision",confirmed:"you confirmed"}[f.status]}</span>`:"Hidden instruction (blocked)";canvas.style.cursor="pointer";}
    else{tip.hidden=true;canvas.style.cursor="grab";}});
  let down=null;canvas.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);
  canvas.addEventListener("pointerup",e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const f=pick(e);if(f&&order?.fields?.[f]){const i=issuesOf(order).findIndex(t=>t.field===f);if(i>=0)S.issue=i;renderReview();focus(f);}});

  /* ---- loop ---- */
  function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();}
  new ResizeObserver(resize).observe(stage);resize();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clock=new THREE.Clock();
  (function loop(){
    requestAnimationFrame(loop);const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05);
    if(camGoal){camera.position.lerp(camGoal,reduce?1:.06);controls.target.lerp(tgtGoal,reduce?1:.06);if(camera.position.distanceTo(camGoal)<.02)camGoal=null;}
    stackT+=(stackTarget-stackT)*(reduce?1:.07);
    if(!reduce&&view!=="shelf"){doc.position.y=Math.sin(t*.8)*.08;doc.rotation.y=Math.sin(t*.35)*.03*(1-stackT);}
    layers.children.forEach(m=>{m.position.z=m.userData.li*1.75*stackT;m.material.opacity=Math.min(1,stackT*1.2)*(m.userData.li===4?.95:.8);m.visible=stackT>.02;});
    beams.children.forEach(b=>{b.scale.z=Math.max(.001,4*1.75*stackT);const on=!hi||b.userData.field===hi;b.material.opacity=stackT*(on?.85:.15);b.visible=stackT>.02;});
    boxes.children.forEach(g=>{if(!g.userData.fill)return;const on=g.userData.field===hi||g.userData.field===hover;
      const z=g.userData.baseZ+(on?.45+Math.sin(t*4)*.05:0);g.position.z+=(z-g.position.z)*.2;
      const st=order?.fields?.[g.userData.field]?.status;const pulse=(st==="conflict"||g.userData.field==="injection")?.12+Math.sin(t*3)*.08:0;
      g.userData.fill.material.opacity=(on?.42:.16)+pulse;g.visible=stackT<.95||on;});
    scanBar.material.opacity+=((scanning?.85:0)-scanBar.material.opacity)*.15;
    if(scanning)scanBar.position.y=H/2-((t*4.2)%H);
    shelf.children.forEach(c=>{if(c.userData.pulse)c.scale.setScalar(1+Math.sin(t*4)*.08);});
    controls.update();renderer.render(scene,camera);
  })();
  return {loadFax,loadOrder,setView,highlight,focus,scan,theme};
})();
